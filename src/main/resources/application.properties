server.port=0

# Local access guard tunables (defaults are fine for local verification)
access-guard.token-secret=local-dev-secret-change-me-please-32bytes
access-guard.token-ttl=30m
access-guard.lock-threshold=5
access-guard.lock-duration=5m
access-guard.failure-window=15m
access-guard.max-tracked-accounts=10000
access-guard.source-rate-limit=60
access-guard.rate-window=1m
access-guard.max-tracked-sources=10000
